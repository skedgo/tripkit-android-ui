apply plugin: 'com.android.library'
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"
apply plugin: 'maven-publish'
apply plugin: 'kotlin-parcelize'

android {
    compileSdkVersion versions.compileSdkVersion

    defaultConfig {
        minSdkVersion versions.proMinSdkVersion
        targetSdkVersion versions.targetSdkVersion

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        staging {
            debuggable true
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    publishing {
        singleVariant("release") {
            // if you don't want sources/javadoc, remove these lines
            withSourcesJar()
            withJavadocJar()
        }
    }
    namespace 'com.skedgo.tripkit.ui.domain'

}

dependencies {
    coreLibraryDesugaring libs.desugar

    implementation libs.kotlin
    implementation libs.rxjava2
    implementation libs.rxrelay2
    implementation libs.jodaTimeAndroid

    implementation libs.dagger
    implementation libs.timber
    kapt libs.daggerCompiler
    kapt libs.value
    compileOnly libs.valueAnnotations


    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'

    debugImplementation project(':TripKitAndroid')
    stagingImplementation project(':TripKitAndroid')
    releaseImplementation project(':TripKitAndroid')
}

group = tripkitGroup
version = tripkitVersion

publishing {
    repositories {
        maven {
            url = "file://${localMaven}"
            //url = publishMavenUrl
            credentials {
                username = publishMavenUsername
                password = publishMavenToken
            }
        }
    }

    publications {
        release(MavenPublication) {
            groupId = group
            version = version
            artifactId = 'TripKitAndroidUIDomain'
            afterEvaluate {
                from components.release
            }
            pom {
                licenses {
                    license {
                        name = 'Commercial'
                    }
                }
            }
            // Use Gradle's component metadata for dependency types and scopes.
            // implementation dependencies may be JARs or AARs; never force all to AAR.
        }
    }
}

afterEvaluate {
    if (tasks.findByName("dokkaGfmPartial")) {
        tasks.named("dokkaGfmPartial").configure {
            dependsOn(
                    tasks.getByName("kaptReleaseKotlin"),
                    tasks.getByName("kaptStagingKotlin"),
                    tasks.getByName("kaptDebugKotlin")
            )
        }
    }
}
